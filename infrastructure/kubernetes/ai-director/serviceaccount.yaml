# ServiceAccount for the AI Director with Workload Identity.
#
# The annotation binds this Kubernetes SA to a Google Service Account
# created by Terraform.  This lets the AI Director pod authenticate to
# Pub/Sub without mounting any key files.
#
# Annotation value format:
#   <gsa_email>
# Replace with the Terraform output:
#   terraform output ai_director_service_account_email

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-director
  namespace: ai-director
  annotations:
    iam.gke.io/gcp-service-account: REPLACE_WITH_TERRAFORM_OUTPUT
