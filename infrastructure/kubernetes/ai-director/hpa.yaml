# HorizontalPodAutoscaler for the AI Director.
# Scales between 1 and 5 replicas based on CPU utilisation.

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-director
  namespace: ai-director
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-director
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
