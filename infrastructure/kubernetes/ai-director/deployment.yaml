# AI Director FastAPI deployment.
# Runs on the CPU system node pool and auto-scales via HPA.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-director
  namespace: ai-director
  labels:
    app: ai-director
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-director
  template:
    metadata:
      labels:
        app: ai-director
    spec:
      serviceAccountName: ai-director

      # Run on CPU system nodes.
      nodeSelector:
        pool: system

      containers:
        - name: ai-director
          # Replace YOUR_REGISTRY with your Artifact Registry location, e.g.
          # us-central1-docker.pkg.dev/my-project/mmp-images
          image: YOUR_REGISTRY/mmp-images/ai-director:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: ai-director-config
          env:
            # Additional env vars (secrets) can be injected via a Kubernetes
            # Secret mounted here, e.g. AI_DIRECTOR_PRIVATE_KEY.
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: ai-director-config
                  key: GCP_PROJECT_ID

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: filestore-outputs
              mountPath: /mnt/filestore

      volumes:
        - name: filestore-outputs
          persistentVolumeClaim:
            claimName: comfyui-models-pvc
