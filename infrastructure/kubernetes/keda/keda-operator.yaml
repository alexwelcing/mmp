# KEDA operator installation via Helm (GitOps-style manifest).
# In production use: helm install keda kedacore/keda -n keda
# This file documents the expected KEDA version and configuration.

apiVersion: v1
kind: ConfigMap
metadata:
  name: keda-install-notes
  namespace: keda
data:
  install.sh: |
    #!/usr/bin/env bash
    # Install KEDA 2.15 via Helm.
    helm repo add kedacore https://kedacore.github.io/charts
    helm repo update
    helm install keda kedacore/keda \
      --namespace keda \
      --version 2.15.0 \
      --set watchNamespace=comfyui \
      --set prometheus.metricServer.enabled=true \
      --set prometheus.operator.enabled=true
