# KEDA Helm values for production-style installation.
#
# Install KEDA via Helm (recommended):
#   helm repo add kedacore https://kedacore.github.io/charts
#   helm repo update
#   helm install keda kedacore/keda \
#     --namespace keda \
#     --version 2.15.0 \
#     -f keda-helm-values.yaml

watchNamespace: ""
prometheus:
  metricServer:
    enabled: true
  operator:
    enabled: true
