# KEDA operator installation via kubectl + kustomize.
# Applies the official KEDA v2.15.0 release manifest.
#
# Usage:
#   kubectl apply -k infrastructure/kubernetes/keda/
#
# For upgrades:
#   kubectl apply -k infrastructure/kubernetes/keda/

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keda
resources:
  - https://github.com/kedacore/keda/releases/download/v2.15.0/keda-2.15.0.yaml
