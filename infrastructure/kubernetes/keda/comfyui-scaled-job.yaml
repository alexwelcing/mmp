# KEDA ScaledJob for ComfyUI asset generation workers.
#
# How it works:
#   1. KEDA polls the GCP Pub/Sub subscription for undelivered message count.
#   2. For each message, KEDA creates a Kubernetes Job.
#   3. Each Job pulls one ComfyUI worker container, processes the request,
#      and exits (enabling true scale-to-zero).
#   4. GPU nodes are provisioned by cluster autoscaler on demand.
#
# Cost optimisation: GPU nodes are Spot/Preemptible (see Terraform). Jobs
# include a retry policy to handle node pre-emptions gracefully.

apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: comfyui-worker
  namespace: comfyui
spec:
  # ── Scaling policy ─────────────────────────────────────────────────
  minReplicaCount: 0    # Scale to zero when queue is empty — no idle GPU cost
  maxReplicaCount: 15   # Hard cap to control spend
  pollingInterval: 10   # Check queue every 10 seconds
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5

  # ── Scaling trigger: GCP Pub/Sub queue depth ───────────────────────
  triggers:
    - type: gcp-pub-sub
      metadata:
        subscriptionName: asset-generation-requests-sub-staging
        mode: SubscriptionSize
        value: "1"           # 1 job per undelivered message
        activationValue: "0"

      # Workload Identity authentication — no key files in the cluster.
      authenticationRef:
        name: keda-gcp-auth

  # ── Job template ────────────────────────────────────────────────────
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 3   # Retry up to 3 times (handles Spot pre-emptions)
    activeDeadlineSeconds: 300  # Kill jobs stuck >5 minutes

    template:
      metadata:
        labels:
          app: comfyui-worker
          version: "1.0"
        annotations:
          # gVisor sandbox for CUDA checkpointing.
          io.kubernetes.cri-o.SandboxConfig: gvisor
      spec:
        # Target GPU nodes.
        nodeSelector:
          pool: gpu

        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"

        restartPolicy: Never

        # Init container: wait for Filestore NFS to be mounted.
        initContainers:
          - name: wait-for-nfs
            image: busybox:1.36
            command: ["sh", "-c", "until ls /mnt/filestore/models > /dev/null 2>&1; do echo 'Waiting for NFS...'; sleep 2; done"]
            volumeMounts:
              - name: filestore-models
                mountPath: /mnt/filestore

        containers:
          - name: comfyui
            image: us-central1-docker.pkg.dev/YOUR_PROJECT/mmp-images/comfyui-worker:latest
            imagePullPolicy: Always

            resources:
              requests:
                cpu: "2"
                memory: "8Gi"
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: "16Gi"
                nvidia.com/gpu: "1"

            env:
              - name: COMFYUI_MODEL_PATH
                value: /mnt/filestore/models
              - name: COMFYUI_OUTPUT_PATH
                value: /mnt/filestore/outputs
              - name: AI_DIRECTOR_WEBHOOK_URL
                value: http://ai-director.ai-director.svc.cluster.local:8080/webhook/comfyui

            volumeMounts:
              - name: filestore-models
                mountPath: /mnt/filestore

            # Liveness: restart if ComfyUI API stops responding.
            livenessProbe:
              httpGet:
                path: /system_stats
                port: 8188
              initialDelaySeconds: 30
              periodSeconds: 15
              failureThreshold: 3

        volumes:
          - name: filestore-models
            persistentVolumeClaim:
              claimName: comfyui-models-pvc

---
# TriggerAuthentication: maps GKE Workload Identity to KEDA's GCP scaler.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-gcp-auth
  namespace: comfyui
spec:
  podIdentity:
    provider: gcp
